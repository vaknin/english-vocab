<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introductions – English Words</title>
<style>
  /* Colours – bright but high contrast */
  :root {
    --ink: #1A1A3D; --blue: #1747B8; --green: #0C7A40; --red: #D72D4B; --orange: #F07C12;
    --yellow: #FFD23F; --purple: #7A3FD1; --acc: var(--blue);
    --font: "Baloo 2", "Nunito", "Varela Round", ui-rounded, "Arial Rounded MT Bold", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink); font-family: var(--font); font-weight: 700;
    background: radial-gradient(circle at 12% 18%, #FFF0B8 0, transparent 38%),
                radial-gradient(circle at 88% 85%, #CDEBFF 0, transparent 42%),
                linear-gradient(160deg, #FFF8E2 0%, #FFE7F0 55%, #E3F3FF 100%);
    background-attachment: fixed;
    display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
  }
  [lang="he"] { font-family: "Rubik", Arial, "Noto Sans Hebrew", sans-serif; font-weight: 700; }
  button { font-family: var(--font); }

  /* Top bar: title + 4 stage buttons (a stepper) + full screen */
  header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 0.8rem 1.2rem 0.4rem; }
  header h1 { margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.8rem); line-height: 1; font-weight: 800;
    background: linear-gradient(90deg, #F04E7C, #F07C12 50%, #7A3FD1); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header h1 span { -webkit-text-fill-color: initial; }
  nav { display: flex; gap: 0.6rem; flex: 1; justify-content: center; flex-wrap: wrap; }
  nav button {
    --c: var(--blue); font-weight: 800; font-size: clamp(1.15rem, 1.9vw, 2rem); line-height: 1;
    padding: 0.45em 0.9em 0.4em; border-radius: 999px; border: 4px solid var(--c); background: #fff; color: var(--c);
    cursor: pointer; box-shadow: 0 5px 0 var(--c); transition: transform .15s, box-shadow .15s, background .2s, color .2s;
    display: flex; align-items: center; gap: 0.4em;
  }
  nav button .n { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%;
    background: var(--c); color: #fff; font-size: 0.8em; }
  nav button:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--c); }
  nav button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--c); }
  nav button.on { background: var(--c); color: #fff; }
  nav button.on .n { background: #fff; color: var(--c); }
  .fs { width: 3.2rem; height: 3.2rem; border-radius: 50%; border: 4px solid var(--ink); background: #fff; color: var(--ink);
    font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .15s; }
  .fs:hover { transform: translateY(-2px) rotate(8deg); }
  [data-stage="present"], #present { --c: var(--blue); --acc: var(--blue); }
  [data-stage="repeat"], #repeat { --c: var(--purple); --acc: var(--purple); }
  [data-stage="practice"], #practice { --c: var(--green); --acc: var(--green); }
  [data-stage="use"], #use { --c: var(--orange); --acc: #C25E00; }

  main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0.6rem 1rem 1.2rem; }
  .stage { display: none; width: 100%; max-width: 1600px; flex-direction: column; align-items: center; text-align: center; }
  .stage.on { display: flex; }
  .card { width: 100%; background: rgba(255,255,255,0.92); border-radius: 2.5rem; padding: clamp(0.8rem, 2vw, 2rem);
    box-shadow: 0 14px 40px rgba(60, 40, 120, 0.15), 0 0 0 5px rgba(255,255,255,0.7) inset;
    display: flex; flex-direction: column; align-items: center; }
  .in-next { animation: inNext .45s cubic-bezier(.2,1.3,.4,1); }
  .in-prev { animation: inPrev .45s cubic-bezier(.2,1.3,.4,1); }
  .in-pop  { animation: inPop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes inNext { from { transform: translateX(120px) rotate(2deg); opacity: 0; } }
  @keyframes inPrev { from { transform: translateX(-120px) rotate(-2deg); opacity: 0; } }
  @keyframes inPop { from { transform: scale(.85); opacity: 0; } }

  .top { display: flex; align-items: center; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 0.4rem; }
  .hint { font-size: clamp(1.2rem, 2vw, 2.1rem); color: #4A4A6A; margin: 0; }
  .dots { display: flex; gap: 0.5rem; align-items: center; }
  .dots i { width: 0.9rem; height: 0.9rem; border-radius: 50%; background: #D9D9E8; transition: all .3s; }
  .dots i.seen { background: var(--acc); opacity: 0.45; }
  .dots i.now { background: var(--acc); width: 2.2rem; border-radius: 999px; opacity: 1; }

  .pic { width: min(84vw, 58vh, 640px); aspect-ratio: 4 / 3; border-radius: 2rem; overflow: hidden;
    border: 6px solid var(--ink); box-shadow: 0 8px 0 var(--ink); background: #fff; }
  .pic svg { width: 100%; height: 100%; display: block; }
  .word { font-size: clamp(4rem, 10vw, 10rem); font-weight: 800; line-height: 0.95; margin: 0.12em 0 0; color: var(--blue); letter-spacing: 0.01em; }
  .heb { font-size: clamp(2.4rem, 5vw, 5rem); color: var(--green); margin: 0.05em 0 0; line-height: 1.2; }

  .row { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
  .big {
    --c: var(--ink); font-weight: 800; font-size: clamp(1.5rem, 2.6vw, 2.7rem); line-height: 1;
    padding: 0.42em 1.1em 0.36em; border-radius: 999px; border: 5px solid var(--c); background: #fff; color: var(--c);
    cursor: pointer; box-shadow: 0 7px 0 var(--c); transition: transform .12s, box-shadow .12s, filter .2s;
  }
  .big:hover:not([disabled]) { transform: translateY(-3px); box-shadow: 0 10px 0 var(--c); }
  .big:active:not([disabled]) { transform: translateY(6px); box-shadow: 0 1px 0 var(--c); }
  .big.go { background: linear-gradient(180deg, #FFE36E, #FFC21A); }
  .big.listen { background: linear-gradient(180deg, #6FB2FF, #2D74E8); color: #fff; --c: #123C8C; border-color: #123C8C; }
  .big[disabled] { opacity: 0.3; cursor: default; }

  .present-wrap { display: flex; align-items: center; gap: clamp(1rem, 4vw, 4rem); justify-content: center; flex-wrap: wrap; }
  .present-text { display: flex; flex-direction: column; align-items: center; min-width: 28vw; }

  /* Repeat */
  .reveal-card { cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .reveal-card:hover .pic { transform: rotate(-1deg) scale(1.01); }
  .reveal-card .pic { transition: transform .2s; }
  .q { font-size: clamp(4rem, 10vw, 10rem); line-height: 0.95; margin: 0.12em 0 0; color: var(--purple);
    animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(4deg); } }
  .reveal { animation: inPop .5s cubic-bezier(.2,1.5,.4,1); }

  /* Practice */
  .game { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(1.5rem, 8vw, 10rem); width: 100%; max-width: 1150px; }
  .col { display: flex; flex-direction: column; gap: clamp(0.5rem, 1.5vh, 1.1rem); }
  .tile {
    font-weight: 800; font-size: clamp(2rem, 4.2vw, 4.2rem); line-height: 1.1; padding: 0.12em 0.4em;
    border-radius: 1.2rem; border: 5px solid var(--ink); background: #fff; color: var(--ink);
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 6px 0 var(--ink);
    transition: transform .15s, box-shadow .15s, background .2s;
  }
  .tile:hover:not(.done) { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 9px 0 var(--ink); }
  .tile.en { color: var(--blue); }
  .tile.he { color: var(--green); }
  .tile.sel { background: #FFE36E; transform: scale(1.04); }
  .tile.done { background: linear-gradient(180deg, #C9F7D3, #8EE6A4); border-color: var(--green); box-shadow: 0 6px 0 var(--green);
    color: #0A5A2F; cursor: default; animation: matched .6s cubic-bezier(.2,1.6,.4,1); }
  .tile.done::after { content: " ✓"; }
  .tile.wrong { animation: shake .5s; background: #FFE4E4; }
  .tile.over { outline: 6px dashed var(--orange); outline-offset: 4px; transform: scale(1.04); }
  .ghost { position: fixed; pointer-events: none; z-index: 50; transform: translate(-50%, -50%) rotate(-4deg) scale(1.06);
    margin: 0; box-shadow: 0 18px 30px rgba(0,0,0,.25); }
  .msg { font-size: clamp(2rem, 3.8vw, 3.8rem); font-weight: 800; min-height: 1.3em; margin: 0.4em 0 0; line-height: 1.2; }
  .msg.good { color: var(--green); animation: inPop .5s cubic-bezier(.2,1.6,.4,1); }
  .msg.try { color: #B04A00; animation: inPop .4s; }
  @keyframes matched { 0% { transform: scale(1); } 35% { transform: scale(1.14) rotate(-2deg); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .burst { position: fixed; pointer-events: none; z-index: 60; font-size: 2.6rem; animation: fly .9s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(200deg) scale(0.4); opacity: 0; } }

  /* Celebration */
  .well { position: fixed; inset: 0; background: rgba(26,26,61,0.55); display: none; align-items: center; justify-content: center; z-index: 70; }
  .well.on { display: flex; }
  .well > div { background: linear-gradient(180deg, #fff, #FFF6D0); border-radius: 3rem; padding: 2rem 4rem 2.5rem; text-align: center;
    border: 8px solid var(--yellow); box-shadow: 0 12px 0 #E0A800; animation: inPop .6s cubic-bezier(.2,1.6,.4,1); }
  .well h2 { font-size: clamp(3.5rem, 9vw, 9rem); margin: 0; color: var(--green); line-height: 1; }
  .well p { font-size: clamp(2.2rem, 4.5vw, 4.5rem); margin: 0.1em 0 0.3em; color: var(--red); }
  .well .stars { font-size: clamp(3rem, 6vw, 6rem); margin: 0 0 0.3em; }
  .well .stars span { display: inline-block; animation: star 1s cubic-bezier(.2,1.6,.4,1) backwards; }
  .well .stars span:nth-child(2) { animation-delay: .2s; } .well .stars span:nth-child(3) { animation-delay: .4s; }
  @keyframes star { from { transform: scale(0) rotate(-180deg); } }
  .confetti { position: fixed; top: -20px; width: 14px; height: 22px; z-index: 80; pointer-events: none; border-radius: 3px;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); } }

  /* Use it */
  .sentence { font-size: clamp(2.6rem, 6vw, 6.2rem); font-weight: 800; line-height: 1.15; display: flex; align-items: center;
    justify-content: center; flex-wrap: wrap; gap: 0.3em; cursor: pointer; }
  .blank { display: inline-flex; border: 6px dashed var(--orange); border-radius: 1.6rem; background: #FFF6E8; padding: 0.12em;
    transition: transform .2s; }
  .sentence:hover .blank { transform: rotate(-2deg) scale(1.03); }
  .blank svg { width: clamp(160px, 24vw, 380px); height: auto; aspect-ratio: 4 / 3; display: block; border-radius: 1.1rem; }
  .full { font-size: clamp(2.8rem, 6.5vw, 6.8rem); font-weight: 800; color: var(--blue); margin: 0.2em 0 0; min-height: 1.15em; line-height: 1.1; }
  .full b { color: var(--red); background: linear-gradient(transparent 62%, #FFE36E 62%); padding: 0 0.1em; }
  .tap { font-size: clamp(1.3rem, 2.2vw, 2.2rem); color: #6A6A88; margin: 0.25em 0 0; }

  @media (max-width: 700px) {
    header { padding: 0.6rem 0.6rem 0.2rem; gap: 0.5rem; }
    header h1 { flex: 1; }
    nav { order: 3; width: 100%; gap: 0.35rem; }
    nav button { font-size: 1rem; padding: 0.4em 0.6em; border-width: 3px; }
    main { padding: 0.4rem 0.5rem 1rem; }
    .card { border-radius: 1.6rem; }
    .present-wrap { gap: 0.3rem; }
    .game { gap: 0.8rem; }
    .tile { font-size: 1.75rem; border-width: 4px; }
    .big { font-size: 1.35rem; border-width: 4px; }
    .well > div { padding: 1.5rem; margin: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <h1><span>👋</span> Hello English!</h1>
  <nav>
    <button data-stage="present"><span class="n">1</span>Present</button>
    <button data-stage="repeat"><span class="n">2</span>Repeat</button>
    <button data-stage="practice"><span class="n">3</span>Practice</button>
    <button data-stage="use"><span class="n">4</span>Use it</button>
  </nav>
  <button class="fs" id="fsBtn" title="Full screen (F)" aria-label="Full screen">⛶</button>
</header>

<main>
  <section class="stage" id="present"></section>
  <section class="stage" id="repeat"></section>
  <section class="stage" id="practice"></section>
  <section class="stage" id="use"></section>
</main>

<div class="well" id="well"><div>
  <h2>Well done!</h2>
  <p lang="he" dir="rtl">כל הכבוד!</p>
  <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
  <button class="big go" id="again">Play again</button>
</div></div>

<script>
/* =====================================================================
   LESSON DATA – edit here to change words, Hebrew, pictures, sentences.
   - WORDS: new words. "pic" is the name of a picture in PICS below.
   - SENTENCES: "before" + [picture] + "after". "full" is what is shown
     and read aloud when the class clicks. "fill" is the word in red.
     "he" (optional) is a Hebrew line shown under the sentence.
   ===================================================================== */
const WORDS = [
  { en: "hello",   he: "שלום",    pic: "hello" },
  { en: "goodbye", he: "להתראות", pic: "goodbye" },
  { en: "name",    he: "שם",      pic: "name" },
  { en: "friend",  he: "חבר",     pic: "friend" },
  { en: "nice",    he: "נחמד",    pic: "nice" },
  { en: "meet",    he: "לפגוש",   pic: "meet" },
];

const SENTENCES = [
  { before: "Hello, my name is", pic: "name",     after: ".", fill: "Noa",       full: "Hello, my name is Noa." },
  { before: "I like",            pic: "pizza",    after: ".", fill: "pizza",     full: "I like pizza." },
  { before: "I don't like",      pic: "sushi",    after: ".", fill: "sushi",     full: "I don't like sushi." },
  { before: "I like",            pic: "salad",    after: ".", fill: "salad",     full: "I like salad." },
  { before: "I like",            pic: "water",    after: ".", fill: "water",     full: "I like water." },
  { before: "I don't like",      pic: "sandwich", after: ".", fill: "sandwiches", full: "I don't like sandwiches." },
  { before: "Nice to",           pic: "meet",     after: "you!", fill: "meet",   full: "Nice to meet you!", he: "נעים להכיר" },
  { before: "This is my friend", pic: "friend",   after: ".", fill: "Tom",       full: "This is my friend Tom." },
  { before: "",                  pic: "goodbye",  after: "!", fill: "Goodbye",   full: "Goodbye!" },
];

/* =====================================================================
   PICTURES – each one is a small hand-drawn SVG (viewBox 400 x 300).
   To change a picture, edit or replace its function.
   ===================================================================== */
const SKIN = "#F2C08F", OUT = "#1B1B3A";

// A simple kid. arms: [dx, dy] of each hand from the body centre, or null for "down".
function kid(x, { shirt = "#2F7BE5", hair = "#6B3E26", left = null, right = null, long = false } = {}) {
  const y = 20, sh = y + 112;
  const L = left || [-62, 190 - sh + y], R = right || [62, 190 - sh + y];
  const arm = (side, [dx, dy]) =>
    `<line x1="${x + side * 36}" y1="${sh}" x2="${x + dx}" y2="${sh + dy}" stroke="${OUT}" stroke-width="28" stroke-linecap="round"/>
     <line x1="${x + side * 36}" y1="${sh}" x2="${x + dx}" y2="${sh + dy}" stroke="${shirt}" stroke-width="19" stroke-linecap="round"/>
     <circle cx="${x + dx}" cy="${sh + dy}" r="14" fill="${SKIN}" stroke="${OUT}" stroke-width="4"/>`;
  return `<g stroke-linejoin="round">
    <g stroke-linecap="round"><path d="M${x - 18} ${y + 200} L${x - 22} ${y + 258} M${x + 18} ${y + 200} L${x + 22} ${y + 258}" stroke="${OUT}" stroke-width="28"/>
    <path d="M${x - 18} ${y + 200} L${x - 22} ${y + 258} M${x + 18} ${y + 200} L${x + 22} ${y + 258}" stroke="#3E5BA8" stroke-width="19"/></g>
    <rect x="${x - 42}" y="${y + 100}" width="84" height="110" rx="26" fill="${shirt}" stroke="${OUT}" stroke-width="5"/>
    ${arm(-1, L)}${arm(1, R)}
    ${long ? `<path d="M${x - 44} ${y + 62} Q${x - 50} ${y + 120} ${x - 30} ${y + 118} L${x + 30} ${y + 118} Q${x + 50} ${y + 120} ${x + 44} ${y + 62} Z" fill="${hair}"/>` : ""}
    <circle cx="${x}" cy="${y + 58}" r="42" fill="${SKIN}" stroke="${OUT}" stroke-width="5"/>
    <path d="M${x - 42} ${y + 52} Q${x - 40} ${y + 10} ${x} ${y + 14} Q${x + 40} ${y + 10} ${x + 42} ${y + 52} Q${x + 20} ${y + 30} ${x - 42} ${y + 52} Z" fill="${hair}" stroke="${OUT}" stroke-width="2"/>
    <circle cx="${x - 15}" cy="${y + 57}" r="8" fill="${OUT}"/><circle cx="${x + 15}" cy="${y + 57}" r="8" fill="${OUT}"/>
    <circle cx="${x - 12}" cy="${y + 54}" r="3" fill="#fff"/><circle cx="${x + 18}" cy="${y + 54}" r="3" fill="#fff"/>
    <circle cx="${x - 25}" cy="${y + 74}" r="7" fill="#F49A9A" opacity="0.7"/><circle cx="${x + 25}" cy="${y + 74}" r="7" fill="#F49A9A" opacity="0.7"/>
    <path d="M${x - 14} ${y + 75} Q${x} ${y + 94} ${x + 14} ${y + 75} Z" fill="#B8323F" stroke="${OUT}" stroke-width="4" stroke-linejoin="round"/>
  </g>`;
}
const heart = (x, y, s = 1, c = "#E8364F") =>
  `<path transform="translate(${x} ${y}) scale(${s})" d="M0 12 C-22 -8 -12 -26 0 -14 C12 -26 22 -8 0 12 Z" fill="${c}" stroke="${OUT}" stroke-width="${2 / s}"/>`;
const waves = (x, y) =>
  `<g fill="none" stroke="#F29D0B" stroke-width="6" stroke-linecap="round">
     <path d="M${x + 24} ${y - 22} q14 18 0 40"/><path d="M${x + 40} ${y - 34} q22 30 0 64"/>
     <path d="M${x - 24} ${y - 22} q-14 18 0 40"/></g>`;
const svg = (body, bg = "#EAF6FF") =>
  `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="400" height="300" fill="${bg}"/>${body}</svg>`;

const PICS = {
  hello: () => svg(
    `<path d="M0 268 Q200 238 400 268 L400 300 L0 300 Z" fill="#8FD46C"/>
     <circle cx="340" cy="50" r="28" fill="#FFD23F"/>
     ${kid(190, { shirt: "#E8553B", right: [86, -110] })}${waves(276, 42)}`),

  goodbye: () => svg(
    `<rect y="262" width="400" height="38" fill="#C9A27A"/>
     <rect x="262" y="40" width="112" height="222" fill="#3B2A1A"/>
     <path d="M262 40 L318 58 L318 262 L262 262 Z" fill="#B5763A" stroke="${OUT}" stroke-width="4"/>
     <circle cx="306" cy="160" r="6" fill="#FFD23F"/>
     <rect x="258" y="36" width="120" height="228" fill="none" stroke="${OUT}" stroke-width="5"/>
     ${kid(170, { shirt: "#7A4FD0", hair: "#2B2B2B", left: [-86, -110], right: [70, 50] })}${waves(84, 42)}
     <g stroke="${OUT}" stroke-width="5" stroke-linecap="round"><line x1="226" y1="250" x2="252" y2="250"/><path d="M244 242 l10 8 l-10 8" fill="none"/></g>`,
    "#FFF1DC"),

  name: () => svg(
    `<rect x="40" y="36" width="320" height="228" rx="22" fill="#fff" stroke="${OUT}" stroke-width="5"/>
     <path d="M40 58 Q40 36 62 36 L338 36 Q360 36 360 58 L360 118 L40 118 Z" fill="#E23B3B" stroke="${OUT}" stroke-width="5"/>
     <text x="200" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="40" fill="#fff">HELLO</text>
     <text x="200" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#fff">my name is</text>
     <text x="200" y="212" text-anchor="middle" font-family="'Comic Sans MS', 'Segoe Print', cursive" font-weight="700" font-size="64" fill="#1D5FD1">Noa</text>
     <line x1="80" y1="232" x2="320" y2="232" stroke="#ccc" stroke-width="3"/>`,
    "#FFF1DC"),

  friend: () => svg(
    `<path d="M0 268 Q200 238 400 268 L400 300 L0 300 Z" fill="#8FD46C"/>
     ${kid(130, { shirt: "#E8553B", long: true, hair: "#C8742B", right: [70, 40] })}
     ${kid(270, { shirt: "#2F7BE5", left: [-70, 40] })}
     ${heart(200, 40, 1.6)}`),

  nice: () => svg(
    `<circle cx="170" cy="155" r="105" fill="#FFD23F" stroke="${OUT}" stroke-width="5"/>
     <path d="M118 128 q14 -18 28 0" fill="none" stroke="${OUT}" stroke-width="7" stroke-linecap="round"/>
     <path d="M194 128 q14 -18 28 0" fill="none" stroke="${OUT}" stroke-width="7" stroke-linecap="round"/>
     <path d="M110 170 Q170 240 230 170 Z" fill="#fff" stroke="${OUT}" stroke-width="6" stroke-linejoin="round"/>
     <circle cx="112" cy="168" r="12" fill="#F49A9A" opacity="0.7"/><circle cx="228" cy="168" r="12" fill="#F49A9A" opacity="0.7"/>
     <g transform="translate(320 205)" stroke="${OUT}" stroke-width="4" stroke-linejoin="round">
       <rect x="-36" y="-20" width="62" height="64" rx="14" fill="${SKIN}"/>
       <path d="M-26 -16 L-18 -70 Q-6 -82 4 -66 L2 -20 Z" fill="${SKIN}"/>

/* ===================== app code below ===================== */
const $ = (s, el = document) => el.querySelector(s);
const dots = (n, i) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k === i ? "now" : k < i ? "seen" : ""}"></i>`).join("")}</div>`;
const anim = (d) => d > 0 ? "in-next" : d < 0 ? "in-prev" : "in-pop";
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let voice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === "en-US" && /google|samantha|zira|aria|jenny/i.test(v.name)) || vs.find(v => v.lang === "en-US") || vs.find(v => /^en/.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.8; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- Stage 1: Present ---------- */
let pIdx = 0;
function renderPresent(d = 0) {
  const w = WORDS[pIdx];
  $("#present").innerHTML = `<div class="card ${anim(d)}">
    <div class="top">${dots(WORDS.length, pIdx)}</div>
    <div class="present-wrap">
      <div class="pic">${PICS[w.pic]()}</div>
      <div class="present-text">
        <p class="word">${w.en}</p>
        <p class="heb" dir="rtl" lang="he">${w.he}</p>
        <div class="row"><button class="big listen" id="pSay" aria-label="Say it">🔊 Listen</button></div>
      </div>
    </div>
    <div class="row">
      <button class="big" id="pPrev" ${pIdx === 0 ? "disabled" : ""}>◀ Back</button>
      <button class="big" id="pNext" ${pIdx === WORDS.length - 1 ? "disabled" : ""}>Next ▶</button>
    </div></div>`;
  $("#pSay").onclick = () => say(w.en);
  $("#pPrev").onclick = () => stepPresent(-1);
  $("#pNext").onclick = () => stepPresent(1);
}
function stepPresent(d) { const n = pIdx + d; if (n >= 0 && n < WORDS.length) { pIdx = n; renderPresent(d); } }

/* ---------- Stage 2: Repeat ---------- */
let rOrder = [], rIdx = 0, rShown = false;
function startRepeat() { rOrder = shuffle(WORDS); rIdx = 0; rShown = false; renderRepeat(); }
function renderRepeat(d = 0) {
  const w = rOrder[rIdx];
  $("#repeat").innerHTML = `<div class="card ${d === "show" ? "" : anim(d)}">
    <div class="top"><p class="hint">What is it? Say it out loud!</p>${dots(rOrder.length, rIdx)}</div>
    <div class="reveal-card" id="rCard">
      <div class="pic">${PICS[w.pic]()}</div>
      ${rShown
        ? `<div class="reveal"><p class="word">${w.en}</p><p class="heb" dir="rtl" lang="he">${w.he}</p></div>`
        : `<p class="q">?</p><p class="tap">Click to show the word</p>`}
    </div>
    <div class="row">
      <button class="big" id="rPrev" ${rIdx === 0 ? "disabled" : ""}>◀ Back</button>
      ${rShown ? `<button class="big listen" id="rSay">🔊 Listen</button>` : `<button class="big go" id="rShow">Show</button>`}
      <button class="big" id="rNext" ${rIdx === rOrder.length - 1 ? "disabled" : ""}>Next ▶</button>
    </div></div>`;
  $("#rCard").onclick = revealRepeat;
  if (rShown) $("#rSay").onclick = () => say(w.en); else $("#rShow").onclick = revealRepeat;
  $("#rPrev").onclick = () => stepRepeat(-1);
  $("#rNext").onclick = () => stepRepeat(1);
}
function revealRepeat() { if (!rShown) { rShown = true; renderRepeat("show"); say(rOrder[rIdx].en); } }
function stepRepeat(d) { const n = rIdx + d; if (n >= 0 && n < rOrder.length) { rIdx = n; rShown = false; renderRepeat(d); } }

/* ---------- Stage 3: Practice (matching) ---------- */
let sel = null, matched = 0;
function startPractice() {
  sel = null; matched = 0;
  $("#well").classList.remove("on");
  const tile = (w, side) => `<div class="tile ${side}" data-en="${w.en}" data-side="${side}" ${side === "he" ? 'dir="rtl" lang="he"' : ""}>${side === "en" ? w.en : w.he}</div>`;
  $("#practice").innerHTML = `<div class="card in-pop">
    <div class="top"><p class="hint">Match the words! Click one, then its partner – or drag it.</p></div>
    <div class="game">
      <div class="col">${shuffle(WORDS).map(w => tile(w, "en")).join("")}</div>
      <div class="col">${shuffle(WORDS).map(w => tile(w, "he")).join("")}</div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="row"><button class="big" id="reset">↺ Reset</button></div></div>`;
  $("#reset").onclick = startPractice;
  document.querySelectorAll("#practice .tile").forEach(attachTile);
}
function setMsg(text, cls) { const m = $("#msg"); m.textContent = text; m.className = "msg " + cls; void m.offsetWidth; }
function tryMatch(a, b) {
  if (a.dataset.side === b.dataset.side) { select(b); return; }
  sel = null; a.classList.remove("sel"); b.classList.remove("sel");
  if (a.dataset.en === b.dataset.en) {
    [a, b].forEach(t => t.classList.add("done"));
    burst(b); burst(a); say(a.dataset.en);
    matched++;
    setMsg(["Great! 🎉", "Super! ⭐", "Yes! 😀", "Well done! 👏"][matched % 4], "good");
    if (matched === WORDS.length) setTimeout(() => { $("#well").classList.add("on"); confetti(); }, 700);
  } else {
    [a, b].forEach(t => { t.classList.remove("wrong"); void t.offsetWidth; t.classList.add("wrong"); });
    setTimeout(() => [a, b].forEach(t => t.classList.remove("wrong")), 600);
    setMsg("Try again 🙂", "try");
  }
}
function select(t) {
  document.querySelectorAll("#practice .tile.sel").forEach(x => x.classList.remove("sel"));
  if (sel === t) { sel = null; return; }
  sel = t; t.classList.add("sel");
}
function burst(el) {
  const r = el.getBoundingClientRect();
  ["⭐", "🎉", "✨", "💛", "⭐", "✨"].forEach((e, i) => {
    const s = document.createElement("span");
    s.className = "burst"; s.textContent = e;
    s.style.left = r.left + r.width / 2 - 20 + "px"; s.style.top = r.top + r.height / 2 - 20 + "px";
    const a = (i / 6) * Math.PI * 2;
    s.style.setProperty("--dx", Math.cos(a) * 140 + "px"); s.style.setProperty("--dy", Math.sin(a) * 110 + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  });
}
function confetti() {
  const colors = ["#F04E7C", "#FFD23F", "#2D74E8", "#13A85B", "#F07C12", "#7A3FD1"];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.2 + Math.random() * 2 + "s";
    c.style.animationDelay = Math.random() * 0.8 + "s";
    c.style.setProperty("--drift", (Math.random() - 0.5) * 300 + "px");
    c.style.setProperty("--spin", Math.random() * 1080 + "deg");
    document.body.appendChild(c); setTimeout(() => c.remove(), 5200);
  }
}
// One handler for click and drag (mouse, touch and pen).
function attachTile(t) {
  t.addEventListener("pointerdown", (e) => {
    if (t.classList.contains("done")) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null;
    const target = (x, y) => {
      const el = document.elementFromPoint(x, y);
      const tt = el && el.closest(".tile");
      return tt && tt !== t && !tt.classList.contains("done") && tt.dataset.side !== t.dataset.side ? tt : null;
    };
    const move = (ev) => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) {
        ghost = t.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel");
        ghost.style.width = t.offsetWidth + "px"; document.body.appendChild(ghost);
      }
      if (ghost) {
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        const tt = target(ev.clientX, ev.clientY);
        if (over !== tt) { over && over.classList.remove("over"); over = tt; over && over.classList.add("over"); }
      }
    };
    const up = (ev) => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      over && over.classList.remove("over");
      if (ghost) {
        ghost.remove();
        const tt = target(ev.clientX, ev.clientY);
        if (tt) tryMatch(t, tt);
      } else if (sel && sel !== t && sel.dataset.side !== t.dataset.side) {
        tryMatch(sel, t);
      } else {
        select(t);
      }
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
}
$("#again").onclick = startPractice;

/* ---------- Stage 4: Use it ---------- */
let uIdx = 0, uShown = false;
function renderUse(d = 0) {
  const s = SENTENCES[uIdx];
  const full = s.full.replace(s.fill, `<b>${s.fill}</b>`);
  $("#use").innerHTML = `<div class="card ${d === "show" ? "" : anim(d)}">
    <div class="top"><p class="hint">Say the sentence!</p>${dots(SENTENCES.length, uIdx)}</div>
    <div class="sentence" id="uCard">
      ${s.before ? `<span>${s.before}</span>` : ""}
      <span class="blank">${PICS[s.pic]()}</span>
      ${s.after ? `<span>${s.after}</span>` : ""}
    </div>
    <p class="full ${uShown ? "reveal" : ""}" id="uFull">${uShown ? full : ""}</p>
    ${s.he ? `<p class="heb" dir="rtl" lang="he">${s.he}</p>` : ""}
    ${uShown ? "" : `<p class="tap">Click to show the sentence</p>`}
    <div class="row">
      <button class="big" id="uPrev" ${uIdx === 0 ? "disabled" : ""}>◀ Back</button>
      ${uShown ? `<button class="big listen" id="uSay">🔊 Listen</button>` : `<button class="big go" id="uShow">Show</button>`}
      <button class="big" id="uNext" ${uIdx === SENTENCES.length - 1 ? "disabled" : ""}>Next ▶</button>
    </div></div>`;
  $("#uCard").onclick = revealUse;
  if (uShown) $("#uSay").onclick = () => say(s.full); else $("#uShow").onclick = revealUse;
  $("#uPrev").onclick = () => stepUse(-1);
  $("#uNext").onclick = () => stepUse(1);
}
function revealUse() { if (uShown) say(SENTENCES[uIdx].full); else { uShown = true; renderUse("show"); say(SENTENCES[uIdx].full); } }
function stepUse(d) { const n = uIdx + d; if (n >= 0 && n < SENTENCES.length) { uIdx = n; uShown = false; renderUse(d); } }

/* ---------- navigation ---------- */
let stage = "present";
function show(name) {
  stage = name;
  document.querySelectorAll(".stage").forEach(s => s.classList.toggle("on", s.id === name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.stage === name));
  if (name === "present") renderPresent();
  if (name === "repeat") startRepeat();
  if (name === "practice") startPractice();
  if (name === "use") { uShown = false; renderUse(); }
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.stage));
$("#fsBtn").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
};
document.addEventListener("keydown", (e) => {
  const step = { present: stepPresent, repeat: stepRepeat, use: stepUse }[stage];
  if (e.key === "ArrowRight" && step) step(1);
  else if (e.key === "ArrowLeft" && step) step(-1);
  else if ((e.key === " " || e.key === "Enter") && stage === "repeat") { e.preventDefault(); revealRepeat(); }
  else if ((e.key === " " || e.key === "Enter") && stage === "use") { e.preventDefault(); revealUse(); }
  else if (["1", "2", "3", "4"].includes(e.key)) show(["present", "repeat", "practice", "use"][+e.key - 1]);
  else if (e.key === "f" || e.key === "F") $("#fsBtn").click();
});
show("present");
</script>
